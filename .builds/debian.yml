image: debian/testing

secrets:
  - ea8ca0d9-1859-4db5-bb99-8f12baf60b59

packages:
  - clang
  - llvm-dev
  - libllvm-20-ocaml-dev
  - llvm-20-dev
  - meson
  - nodejs
  - npm
  - valgrind

sources:
  - git+ssh://git@git.sr.ht/~klahr/quadrate

environment:
  GIT_SSH_COMMAND: "ssh -o StrictHostKeyChecking=no"

tasks:
  - install_tree_sitter: |
      sudo npm install -g tree-sitter-cli
  - build: |
      cd quadrate
      make release
  - test: |
      cd quadrate
      make tests
  - test_optimized: |
      cd quadrate
      bash tests/run_tests.sh optimized -O2
      bash tests/run_tests.sh optimized -O3
  - valgrind: |
      cd quadrate
      make valgrind

triggers:
  - action: email
    condition: failure
    to: klahr@r8.rs
