image: archlinux

packages:
  - clang
  - llvm
  - meson
  - nodejs
  - openssl
  - pkgconf
  - sqlite
  - tree-sitter-cli
  - valgrind
  - zlib

sources:
  - git://git@git.sr.ht:~klahr/quadrate
  - https://github.com/quadrate-language/hof
  - https://github.com/quadrate-language/log
  - https://github.com/quadrate-language/compress
  - https://github.com/quadrate-language/net
  - https://github.com/quadrate-language/tls
  - https://github.com/quadrate-language/http
  - https://github.com/quadrate-language/sqlite
  - https://github.com/quadrate-language/json
  - https://github.com/quadrate-language/regex
  - https://github.com/quadrate-language/ct
  - https://github.com/quadrate-language/crypto

tasks:
  - build: |
      cd quadrate
      make release
  - test: |
      cd quadrate
      make tests
  - valgrind: |
      cd quadrate
      export DEBUGINFOD_URLS="https://debuginfod.archlinux.org"
      make valgrind

triggers:
  - action: email
    condition: failure
    to: klahr@r8.rs
