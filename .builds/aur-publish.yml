image: archlinux

secrets:
  - f66123d6-ce21-4a3d-b7c4-921fb5e32fd0

packages:
  - base-devel
  - git
  - openssh

sources:
  - https://git.sr.ht/~klahr/quadrate

tasks:
  - check-tag: |
      cd quadrate
      if ! TAG=$(git describe --exact-match HEAD 2>/dev/null); then
        echo "HEAD is not a tagged commit — nothing to publish."
        complete-build
      fi
      echo "$TAG" > /tmp/aur-tag
      echo "Publishing $TAG to AUR"
  - debug-ssh: |
      ls -la ~/.ssh/ || true
      ssh-keyscan aur.archlinux.org >> ~/.ssh/known_hosts
      ssh -vT -o StrictHostKeyChecking=accept-new aur@aur.archlinux.org 2>&1 | tail -40 || true
  - clone-aur: |
      git config --global user.email "klahr@r8.rs"
      git config --global user.name  "Quadrate Release Bot"
      git clone ssh://aur@aur.archlinux.org/quadrate.git aur
  - bump-pkgbuild: |
      TAG=$(cat /tmp/aur-tag)
      # The repo-side PKGBUILD is the source of truth; copy it over and stamp
      # the version fields from the tag.
      cp quadrate/pkg/aur/quadrate/PKGBUILD aur/PKGBUILD
      cd aur
      sed -i "s/^pkgver=.*/pkgver=$TAG/" PKGBUILD
      sed -i "s/^_gittag=.*/_gittag=$TAG/" PKGBUILD
      sed -i "s/^pkgrel=.*/pkgrel=1/" PKGBUILD
      makepkg --printsrcinfo > .SRCINFO
  - push-aur: |
      cd aur
      if git diff --quiet; then
        echo "AUR PKGBUILD already at $(cat /tmp/aur-tag) — nothing to push."
      else
        git add PKGBUILD .SRCINFO
        git commit -m "Bump to $(cat /tmp/aur-tag)"
        git push origin master
      fi

triggers:
  - action: email
    condition: failure
    to: klahr@r8.rs
